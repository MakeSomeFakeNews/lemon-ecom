scm.ai.extractPurchaseInstruction=This is our purchase order: the supplier is the seller issuing the quotation, delivery note or invoice; do not treat us (the buyer / consignee) as the supplier. Prices and amounts include tax; if only the price excluding tax and the tax rate are given, price including tax = price excluding tax x (1 + tax rate). Put an order-level discount, round-off or allowance in wholeDiscount (positive) and keep line prices before that discount.
scm.ai.extractSalesInstruction=This is our sales order: the customer is the buyer placing the order (the purchaser / consignee on the order); do not treat us (the seller / vendor) as the customer. Prices and amounts include tax; if only the price excluding tax and the tax rate are given, price including tax = price excluding tax x (1 + tax rate). Put an order-level discount, round-off or allowance in wholeDiscount (positive) and keep line prices before that discount.
scm.ai.extractPartnerInstruction=The content may be a business card, business license, invoicing details or company profile. The person on a business card is the contact and the company is the organization name; put the unified social credit code from a business license into the tax ID.
