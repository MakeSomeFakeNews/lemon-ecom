# AI query tools
scm.ai.param.orderNo=Order number (fuzzy match)
scm.ai.param.customer=Customer name or code (fuzzy match)
scm.ai.param.supplier=Supplier name or code
scm.ai.param.partner=Business partner name or code: the customer for sales, the supplier for purchases
scm.ai.param.material=Material name or code (fuzzy match)
scm.ai.param.materialExact=Material name or code that identifies a single material
scm.ai.param.orderStatus=Order status: DRAFT draft, APPROVING under approval, APPROVED approved, PARTIAL partially received/delivered, COMPLETED completed, CLOSED closed
scm.ai.param.groupBy=Grouping, defaults to the first value: CUSTOMER by customer, SUPPLIER by supplier, SALESMAN by salesperson, MATERIAL by material, MONTH by month
scm.ai.param.salesman=Salesperson name (fuzzy match)
scm.ai.param.backorderKind=SALES for sales orders (not yet delivered to customers) or PURCHASE for purchase orders (not yet received from suppliers)
scm.ai.param.overdueOnly=Only lines past the delivery date
scm.ai.param.backorderKeyword=Order number, material code or name
scm.ai.param.tradeType=Document type: SALES_OUT sales delivery, SALES_RETURN sales return, PURCHASE_IN purchase receipt, PURCHASE_RETURN purchase return; defaults to the first value
scm.ai.param.supplierSort=Ranking metric: PURCHASE_AMOUNT purchase amount (default), ON_TIME_RATE on-time delivery rate, IQC_PASS_RATE incoming inspection pass rate, RETURN_RATE return rate
scm.ai.param.ascending=Sort from low to high; default is high to low (use true to find the worst suppliers)
