ecom.text.auto.tpl.HIJACK_NOTIFY.name=Notify owner on hijack
ecom.text.auto.tpl.HIJACK_NOTIFY.desc=When our listing is hijacked, notify the store owner and create a to-do due in 1 day
ecom.text.auto.tpl.HIJACK_NOTIFY.title=Hijacked: $'{'itemId'}'
ecom.text.auto.tpl.HIJACK_NOTIFY.content=$'{'itemId'}' ($'{'sku'}') in $'{'storeName'}' has $'{'newSellers'}' new sellers, now $'{'sellerCount'}'. Please act quickly.
ecom.text.auto.tpl.STOCKOUT_PLAN.name=Purchase plan when cover < 15 days
ecom.text.auto.tpl.STOCKOUT_PLAN.desc=When days of cover drop below 15, create a draft purchase plan and notify the owner
ecom.text.auto.tpl.STOCKOUT_PLAN.title=Stock-out risk: $'{'sku'}' covers $'{'coverDays'}' days
ecom.text.auto.tpl.STOCKOUT_PLAN.content=$'{'sku'}' in $'{'storeName'}': daily $'{'dailySales'}', stock $'{'platformQty'}', in transit $'{'inTransitQty'}', stock-out $'{'stockoutDate'}'. A draft purchase plan was created.
ecom.text.auto.tpl.REVIEW_TICKET.name=Ticket for 1-star reviews
ecom.text.auto.tpl.REVIEW_TICKET.desc=For 1-star reviews with an order, create an after-sales ticket (refund only, amount to confirm) and notify the owner
ecom.text.auto.tpl.REVIEW_TICKET.title=1-star review: $'{'sku'}'
ecom.text.auto.tpl.REVIEW_TICKET.content=Order $'{'orderNo'}' in $'{'storeName'}' received a 1-star review "$'{'title'}'". A ticket was created.
ecom.text.auto.tpl.LOSS_HOLD.name=Hold estimated-loss orders
ecom.text.auto.tpl.LOSS_HOLD.desc=Hold self-fulfilled orders with negative estimated profit and notify the owner
ecom.text.auto.tpl.LOSS_HOLD.title=Loss order held: $'{'orderNo'}'
ecom.text.auto.tpl.LOSS_HOLD.content=Order $'{'orderNo'}' in $'{'storeName'}' has estimated profit $'{'estProfit'}' ($'{'estProfitRate'}'%) and was held. Please check pricing and shipping.
ecom.text.auto.tpl.ACOS_PAUSE.name=Pause campaigns with ACOS > 50%
ecom.text.auto.tpl.ACOS_PAUSE.desc=Pause campaigns with 7-day ACOS over 50% and spend over 20, and notify the owner
ecom.text.auto.tpl.ACOS_PAUSE.title=High ACOS paused: $'{'campaignName'}'
ecom.text.auto.tpl.ACOS_PAUSE.content=Campaign $'{'campaignName'}' in $'{'storeName'}': 7-day spend $'{'spend'}', sales $'{'sales'}', ACOS $'{'acos'}'%. Paused.
ecom.text.auto.tpl.BUDGET_RAISE.name=Raise budget for efficient campaigns
ecom.text.auto.tpl.BUDGET_RAISE.desc=Raise the daily budget by 20% (max 200) for campaigns that run out of budget with ACOS under 30%
ecom.text.auto.tpl.BUDGET_RAISE.title=Budget exhausted: $'{'campaignName'}'
ecom.text.auto.tpl.BUDGET_RAISE.content=Campaign $'{'campaignName'}' in $'{'storeName'}' spent $'{'spend'}' of $'{'dailyBudget'}' on $'{'statDate'}' at ACOS $'{'acos'}'%. Budget raised.
ecom.text.auto.tpl.AUTH_ALERT.name=Store authorization alert
ecom.text.auto.tpl.AUTH_ALERT.desc=When store authorization fails, notify the owner and create a to-do so orders keep syncing
ecom.text.auto.tpl.AUTH_ALERT.title=Store authorization invalid: $'{'storeName'}'
ecom.text.auto.tpl.AUTH_ALERT.content=$'{'storeName'}' ($'{'platform'}' $'{'site'}') authorization failed: $'{'message'}'. Please re-authorize.
ecom.text.auto.tpl.SYNC_FAIL_NOTIFY.name=Channel sync failure alert
ecom.text.auto.tpl.SYNC_FAIL_NOTIFY.desc=Notify the store owner when channel sync fails (once per store and type every 6 hours)
ecom.text.auto.tpl.SYNC_FAIL_NOTIFY.title=Sync failed: $'{'storeName'}'
ecom.text.auto.tpl.SYNC_FAIL_NOTIFY.content=$'{'storeName'}' $'{'syncType'}' sync failed: $'{'message'}'
ecom.text.auto.tpl.MSG_TIMEOUT.name=Overdue buyer message alert
ecom.text.auto.tpl.MSG_TIMEOUT.desc=Remind the store owner when buyer messages pass the reply deadline
ecom.text.auto.tpl.MSG_TIMEOUT.title=Overdue message: $'{'buyerName'}'
ecom.text.auto.tpl.MSG_TIMEOUT.content=Message "$'{'subject'}'" from $'{'buyerName'}' in $'{'storeName'}' is $'{'overdueHours'}' hours overdue.
ecom.text.auto.tpl.CLAIM_DEADLINE.name=FBA claim due in 7 days
ecom.text.auto.tpl.CLAIM_DEADLINE.desc=Create a to-do due in 3 days and notify when a pending claim is due within 7 days
ecom.text.auto.tpl.CLAIM_DEADLINE.title=FBA claim due soon: $'{'claimNo'}'
ecom.text.auto.tpl.CLAIM_DEADLINE.content=Claim $'{'claimNo'}' ($'{'sku'}') in $'{'storeName'}', est. $'{'estAmount'}' $'{'currency'}', due $'{'deadline'}', $'{'daysLeft'}' days left.
ecom.text.auto.tpl.COMPETITOR_SUGGEST.name=Competitor undercut suggestion
ecom.text.auto.tpl.COMPETITOR_SUGGEST.desc=When competitors are 5%+ cheaper and we lose the Buy Box, suggest a 3% price cut (no change) and notify
ecom.text.auto.tpl.COMPETITOR_SUGGEST.title=Undercut: $'{'sku'}'
ecom.text.auto.tpl.COMPETITOR_SUGGEST.content=$'{'sku'}' in $'{'storeName'}' at $'{'price'}'; competitor $'{'competitor'}' at $'{'competitorPrice'}' ($'{'gapPercent'}'% lower).
ecom.text.auto.tpl.INBOUND_OVERDUE.name=Inbound overdue 3 days
ecom.text.auto.tpl.INBOUND_OVERDUE.desc=Notify and create a follow-up to-do when an inbound is 3+ days past ETA
ecom.text.auto.tpl.INBOUND_OVERDUE.title=Inbound overdue: $'{'docNo'}'
ecom.text.auto.tpl.INBOUND_OVERDUE.content=Shipment $'{'docNo'}' ($'{'carrier'}' $'{'trackingNo'}') in $'{'storeName'}' was due $'{'etaDate'}', $'{'overdueDays'}' days overdue.
ecom.text.auto.tpl.RETURN_RATE.name=Return rate > 10% alert
ecom.text.auto.tpl.RETURN_RATE.desc=For SKUs with 30-day return rate over 10% and 20+ units ordered, notify and create a to-do
ecom.text.auto.tpl.RETURN_RATE.title=High returns: $'{'sku'}' $'{'returnRate'}'%
ecom.text.auto.tpl.RETURN_RATE.content=$'{'sku'}' in $'{'storeName'}': $'{'orderedQty'}' ordered, $'{'returnedQty'}' returned in 30 days ($'{'returnRate'}'%).
ecom.text.auto.tpl.EXCEPTION_NOTIFY.name=Order exception alert
ecom.text.auto.tpl.EXCEPTION_NOTIFY.desc=Notify the store owner when a new order is in exception status
ecom.text.auto.tpl.EXCEPTION_NOTIFY.title=Order exception: $'{'orderNo'}'
ecom.text.auto.tpl.EXCEPTION_NOTIFY.content=Order $'{'orderNo'}' in $'{'storeName'}' exception: $'{'exception'}'
ecom.text.auto.tpl.LOSS_HOLD.reason=Estimated loss ($'{'estProfit'}'), auto held
ecom.text.auto.demo.bigOrder=Large / bulk remote order alert
ecom.text.auto.demo.bigOrderTitle=Large order: $'{'orderNo'}' $'{'totalBase'}'
ecom.text.auto.demo.bigOrderContent=Order $'{'orderNo'}' in $'{'storeName'}': $'{'totalAmount'}' $'{'currency'}', $'{'itemQty'}' units to $'{'country'}'. Please review first.
ecom.text.auto.demo.bigOrderRemark=Order amount (base) >= 1500, or shipped to Australia / Canada with 3+ units
ecom.text.auto.demo.webhook=Push sync failures to ops system
