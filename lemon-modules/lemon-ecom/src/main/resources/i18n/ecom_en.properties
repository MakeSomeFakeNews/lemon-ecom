ecom.prompt.asst.dailyAdvice=You are a senior cross-border e-commerce operations director. Below is the store operations data of one day summarized by the system (JSON, amounts in the base currency CNY, percentage fields are already percentages; kpi is the day, prev the previous day, avg7 the daily average of the previous 7 days).\n\
Write "Key points and suggestions":\n\
1. First summarize the day in 2-3 sentences (changes in sales, profit and ad efficiency and the main reasons).\n\
2. Then list 3-6 concrete, actionable suggestions, each starting with "- ", naming the store / SKU / campaign with supporting data (such as lowering the bid of a campaign, replenishment quantity, handling negative reviews, investigating return reasons).\n\
3. Rely only on the given data and do not invent numbers; when data is insufficient, say what to watch. At most 500 words, no headings or Markdown tables.
ecom.prompt.asst.dailyData=Daily report data:
ecom.prompt.asst.listing=You are a senior listing copywriter for {0}. Based on the product information and the current copy, write the product title, bullet points and description as required:\n\
1. Title: brand + core keywords + main selling points / specs, naturally including the given keywords, at most {1} characters, no promotional wording, subjective exaggeration or special symbols.\n\
2. Bullet points: 5 items, each starting with a short capitalized selling point followed by the concrete benefit and specs, at most 250 characters each.\n\
3. Description: paragraphs covering key selling points, specifications, use cases and package contents; do not exaggerate or invent parameters or certifications not in the original.\n\
4. Never use the banned words listed by the user, do not mention other brands (except compatibility notes), and make no medical, antibacterial, eco or other claims that require qualification.\n\
5. Output only JSON: '{'"title": "...", "bullets": ["...", "..."], "description": "..."'}', write only the parts requested in "Parts to write", and nothing else.
ecom.ai.asst.tool.salesCompare=Sales and profit comparison
ecom.ai.asst.tool.salesCompare.desc=Cross-border e-commerce sales and profit comparison: the current period vs. a comparison period (when omitted, the immediately preceding period of the same length, i.e. period-over-period; for year-over-year pass the same period last year), summarized by store / platform / marketplace / SKU: orders, units, sales, profit, margin (base currency; profit after platform fees, refunds, product cost, logistics and ads), differences and change rates. \
The first row is the total (with period and comparePeriod). The SKU dimension also returns the current / comparison average price, unit cost, ad spend and refund, the units returned and negative reviews in the period, and the profit change breakdown effectSales, effectPlatformFees, effectRefund, effectProductCost, effectShipping, effectAdSpend (the effect of each item on profit, positive means more profit). \
To answer "which SKUs had falling profit and why": dimension=SKU, declineOnly=true, explain with the most negative effect* items (higher ad spend, price cuts, higher cost, more refunds) and query return reasons or review content when needed. \
Use marketplace=US for "US site", platform=AMAZON for "Amazon"; "last week" means last Monday to Sunday.
ecom.ai.asst.tool.ads=Ad performance
ecom.ai.asst.tool.ads.desc=Advertising analysis: view=OVERVIEW (first row is the total) spend, ad sales, orders, ACOS, TACOS (ad spend / total sales), CTR, CPC, CVR by store with period-over-period (base currency); CAMPAIGN campaign ranking (store currency, with daily budget and period-over-period); SKU ad spend, ACOS and TACOS by SKU; \
WASTE_TERMS search terms with high spend / many clicks but no orders (negated means already negated, suggest negating the others); TOP_TERMS search terms with the most orders. Dates default to the last 7 days (up to yesterday). Ratio fields are percentages.
ecom.ai.asst.tool.feedback=Returns and negative reviews
ecom.ai.asst.tool.feedback.desc=Return and review analysis: view=RETURN_REASONS distribution of return reasons (returns, units, refunds in base currency); RETURN_SKUS details by SKU + reason; BAD_REVIEWS titles and content of 1-2 star reviews (filter by SKU); REVIEW_SUMMARY reviews, average rating and negative reviews by SKU. Dates default to the last 30 days (up to yesterday).
ecom.ai.asst.tool.orderIssues=Order exceptions and delays
ecom.ai.asst.tool.orderIssues.desc=Order exceptions and delays: summary by store of exceptions (exception / on hold / out of stock), orders past the promised ship-by time and not shipped (overdue), due soon (dueSoon, within 24 hours by default) and pending orders; with kind, lists the orders of that kind (hoursLeft is the hours until ship-by, negative means overdue).
ecom.ai.asst.tool.fba=FBA aging and excess
ecom.ai.asst.tool.fba.desc=Amazon FBA inventory health: view=SUMMARY one row per store with age distribution, excess units, aged units, estimated monthly storage fee and aged surcharge, claimable amount (base currency); AGED inventory older than 180 days; EXCESS excess inventory (available beyond daily sales x excess days, 90 by default); LOW_STOCK SKUs with days of supply under coverDays (30 by default); \
CLAIMS claims pending submission (type, estimated amount, deadline, days left). advice: HEALTHY, PROMOTE, PRICE_DOWN (clearance), REMOVE.
ecom.ai.asst.param.store=Store name or code (fuzzy), all visible stores when empty
ecom.ai.asst.param.platform=Platform, such as AMAZON, SHOPEE, TIKTOK, TEMU, WALMART
ecom.ai.asst.param.marketplace=Marketplace code, such as US, DE, JP, UK, MY, SG
ecom.ai.asst.param.startDate=Start date (inclusive), yyyy-MM-dd
ecom.ai.asst.param.endDate=End date (inclusive), yyyy-MM-dd, yesterday by default
ecom.ai.asst.param.compareStartDate=Comparison start date (inclusive), period-over-period when empty
ecom.ai.asst.param.compareEndDate=Comparison end date (inclusive), period-over-period when empty
ecom.ai.asst.param.dimension=Dimension: STORE (default), PLATFORM, MARKETPLACE (platform + marketplace), SKU (platform SKU)
ecom.ai.asst.param.sortBy=Sort: SALES (default), PROFIT, SALES_CHANGE, PROFIT_CHANGE
ecom.ai.asst.param.declineOnly=Only rows that declined (largest decline first)
ecom.ai.asst.param.adsView=View: OVERVIEW store overview, CAMPAIGN campaign ranking, SKU by SKU, WASTE_TERMS zero-conversion search terms, TOP_TERMS converting search terms
ecom.ai.asst.param.adsKeyword=Keyword of campaign name, SKU or search term
ecom.ai.asst.param.minClicks=Minimum clicks for zero conversion, 10 by default
ecom.ai.asst.param.feedbackView=View: RETURN_REASONS return reasons, RETURN_SKUS return reasons by SKU, BAD_REVIEWS negative review content, REVIEW_SUMMARY reviews by SKU
ecom.ai.asst.param.sku=Platform SKU keyword
ecom.ai.asst.param.orderKind=Kind to list: EXCEPTION exception / on hold / out of stock, OVERDUE overdue and not shipped, DUE_SOON due soon
ecom.ai.asst.param.dueHours=Hours for "due soon", 24 by default
ecom.ai.asst.param.fbaView=View: SUMMARY, AGED aged inventory, EXCESS excess inventory, LOW_STOCK low days of supply, CLAIMS pending claims
ecom.ai.asst.param.excessDays=Excess threshold in days, 90 by default
ecom.ai.asst.param.coverDays=Days of supply threshold (LOW_STOCK), 30 by default
