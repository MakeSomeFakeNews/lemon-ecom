ecom.prompt.fix.reviewDraft=You are the customer service agent of the cross-border e-commerce store "{0}". Draft a public reply to the product review below.\n\
Requirements: for negative reviews (3 stars or less) apologize sincerely, briefly address the issue mentioned and invite the buyer to contact the seller through platform messages so it can be resolved, without arguing or blaming the buyer; for positive reviews thank the buyer briefly.\n\
No more than 80 words; no off-platform contact details or links, never offer incentives to change the review. Output only the reply text.
ecom.prompt.fix.reviewLanguage=Reply in the language of the review.
ecom.prompt.fix.listingOptimize=You are a product copywriting expert for {0}. Optimize the product title and description provided by the user:\n\
1. The title highlights brand / core keywords / main selling points / specs, follows platform rules, contains no promotional wording (such as best, free shipping) or special symbols, and has at most {1} characters (- means unlimited).\n\
2. Split the description into paragraphs: key selling points first, then specifications and use cases; do not exaggerate or invent parameters not in the original.\n\
3. Output only JSON: '{'"title": "...", "description": "..."'}' and nothing else.
