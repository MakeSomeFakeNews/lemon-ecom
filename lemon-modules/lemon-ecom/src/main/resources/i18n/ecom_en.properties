ecom.ai.tool.sales=E-commerce Sales & Profit
ecom.ai.tool.sales.desc=Query cross-border e-commerce sales and profit (base currency) for a period: orders, sales, platform fees, refunds, product cost, logistics cost, ad spend and profit summarised by store, seller SKU or destination country. Use when the user asks how much a store / SKU / country sold or earned, or about margins
ecom.ai.tool.replenish=Platform Warehouse Replenishment
ecom.ai.tool.replenish.desc=List each active SKU''s sales of the last 30 days, daily sales, platform warehouse stock, in-transit quantity, days of cover, expected stock-out date and suggested replenishment quantity, optionally filtered by urgency. Use when the user asks which SKUs are running out or how much to replenish
ecom.ai.param.startDate=Start date (inclusive)
ecom.ai.param.endDate=End date (inclusive)
ecom.ai.param.salesView=Summary view: STORE by store (default), SKU by seller SKU, COUNTRY by destination country
ecom.ai.param.storeId=Store ID; all stores when empty
ecom.ai.param.skuKeyword=Keyword of seller SKU, title or material code / name
ecom.ai.param.top=Maximum number of rows to return
ecom.ai.param.replenishLevel=Urgency: URGENT, WARN or OK; all when empty
