ecom.ai.analytics.forecast.desc=Query the forecast sales (in platform SKU units) of active cross-border e-commerce SKUs for the next N days (1 to 90, default 30): forecast total, forecast daily average, the forecasting method used (MA moving average, WMA weighted moving average, HOLT exponential smoothing with linear trend, SEASONAL weekday seasonality) and its backtest error MAPE (%), plus the actual daily average of the last 28 days and the 30 / 60 / 90 day forecasts. Filter by store or SKU keyword. Use it when the user asks how much a SKU or store will sell next or how accurate the forecast is
ecom.ai.analytics.product=Product analysis
ecom.ai.analytics.product.desc=Cross-border e-commerce product analysis (amounts in base currency): view=ABC classifies SKUs by sales or gross profit (cumulative share within 70% is class A, within 90% class B) and returns class summaries and SKU rows; view=SLOW_MOVING lists slow-moving materials that have stock but no sales in the last N days (default 30) with stock quantity and value, last sale date and stock age, plus the sell-through (moving) rate of SKUs; view=RETURN_RATE lists SKUs with returned units, return rate (%), refund amount and top return reason for orders placed in the period, plus the reason distribution. Use it when the user asks which products are class A, which are slow-moving or which SKUs have high return rates
ecom.ai.analytics.param.forecastDays=Forecast days, 1 to 90, default 30
ecom.ai.analytics.param.view=Analysis: ABC classification, SLOW_MOVING slow-moving stock, RETURN_RATE return rate ranking
